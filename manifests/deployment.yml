apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-inkspire-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
       app: my-app-inkspire
  template:
    metadata:
      labels:
        app: my-app-inkspire
    spec:
      containers:
      - name: my-app-inkspire-container
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 80    